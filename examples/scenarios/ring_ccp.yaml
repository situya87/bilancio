version: 1
name: "Central counterparty ring"
description: >
  Four-firm demonstration of the central counterparty (Plan 061). Every
  ring payable is novated at creation into A->CCP1 + CCP1->B legs. Day 0:
  members contribute 5% of cash to the default fund (F1: 4, F2-F4: 5 each;
  fund 19). Day 1: F1 owes 100 with only 76 cash left - it pays 76,
  defaults, and is expelled; the 24 shortfall runs the waterfall (own
  tranche 4, mutualized tranche 15 drawn 5/5/5 from F2-F4, VMGH residual
  5), so F2 is paid 95 of its 100 claim (haircut 5). F1's day-4 receivable
  (the CCP1->F1 leg) offsets at expulsion, while F4's matching in-leg stays
  open - F4 still pays the CCP on day 4. Day 2: survivors replenish the
  fund (5 each) and the F2->F3 ring leg settles in full through the CCP,
  as do the remaining legs on days 3-4.

clearinghouse:
  enabled: true
  mode: ccp
  ccp_fund_share: 0.05
  vmgh_enabled: true
  replenishment_enabled: true

agents:
  - id: CB
    kind: central_bank
    name: Central Bank
  - id: F1
    kind: firm
    name: Firm One
  - id: F2
    kind: firm
    name: Firm Two
  - id: F3
    kind: firm
    name: Firm Three
  - id: F4
    kind: firm
    name: Firm Four

initial_actions:
  - mint_cash:
      to: F1
      amount: 80
  - mint_cash:
      to: F2
      amount: 100
  - mint_cash:
      to: F3
      amount: 100
  - mint_cash:
      to: F4
      amount: 100
  - create_payable:
      from: F1
      to: F2
      amount: 100
      due_day: 1
      alias: F1_to_F2
  - create_payable:
      from: F2
      to: F3
      amount: 100
      due_day: 2
      alias: F2_to_F3
  - create_payable:
      from: F3
      to: F4
      amount: 100
      due_day: 3
      alias: F3_to_F4
  - create_payable:
      from: F4
      to: F1
      amount: 100
      due_day: 4
      alias: F4_to_F1

run:
  mode: until_stable
  max_days: 8
  quiet_days: 2
  default_handling: expel-agent
  rollover_enabled: false
  show:
    balances: [CB, CCP1, F1, F2, F3, F4]
    events: detailed
